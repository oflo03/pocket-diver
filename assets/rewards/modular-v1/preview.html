function showLayer(containerId,asset){
 const node=$(containerId);node.replaceChildren();if(!asset)return;
 const {meta:m,placement:p}=asset;const [l,t,r,b]=m.bbox,bw=r-l,bh=b-t;
 Object.assign(node.style,{left:100*p.left/pack.canvas.width+'%',top:100*p.top/pack.canvas.height+'%',width:100*p.width/pack.canvas.width+'%',height:100*p.height/pack.canvas.height+'%',transform:p.flipX?'scaleX(-1)':'none'});
